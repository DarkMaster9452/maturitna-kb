name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Build nepotrebuje skutočnú databázu ani secret — iba zástupné hodnoty.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          JWT_SECRET: ci-build-only
